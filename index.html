<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b45">
  <meta name="description" content="မိသားစုကြက်ဥဆိုင်အတွက် ရိုးရှင်းသော အရောင်း၊ အဝင်၊ လက်ကျန်နှင့် အကြွေးစာရင်း app">

  <style>
    :root{--green:#176b45;--green2:#218556;--green-pale:#e8f5ec;--orange:#d97706;--red:#b42318;--ink:#19241e;--muted:#66736c;--line:#dfe7e1;--paper:#f5f8f5;--card:#fff;--blue:#2458a6;--shadow:0 3px 14px rgba(22,56,37,.07)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
    button,input,select,textarea{font:inherit} button{cursor:pointer;touch-action:manipulation} .topbar{background:var(--green);color:#fff;padding:16px 16px 18px;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:920px;margin:auto}.brand{display:flex;gap:11px;align-items:center}.brand-icon{width:48px;height:48px;border-radius:15px;background:#fff;color:var(--green);display:grid;place-items:center;font-size:28px;flex:none}.brand h1{font-size:20px;line-height:1.3;margin:0 0 3px;font-weight:800}.brand p{font-size:12px;margin:0;color:#d8f2e0}.install-btn{border:1px solid #b8e4ca;color:#fff;background:#ffffff18;padding:10px 12px;border-radius:12px;font-weight:700;white-space:nowrap}
    main{max-width:920px;padding:15px 13px;margin:0 auto}.page-title{font-size:23px;margin:4px 0 5px;font-weight:850}.page-sub{color:var(--muted);margin:0 0 17px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.summary{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);min-width:0}.summary .small{font-size:13px;color:var(--muted);margin-bottom:5px}.summary .num{font-size:22px;font-weight:850;line-height:1.25;overflow-wrap:anywhere}.summary .hint{font-size:12px;color:var(--muted);margin-top:5px}.summary.green{background:var(--green-pale);border-color:#cae8d2}.summary.orange{background:#fff3df;border-color:#f4dfbd}.summary.red{background:#fff0ed;border-color:#f5d0c9}
    .section-head{font-size:18px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.inventory-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.inventory-name{font-weight:800;font-size:16px}.inventory-qty{font-size:18px;font-weight:850;color:var(--green);margin:5px 0 2px}.inventory-sub{font-size:12px;color:var(--muted)}
    .quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{display:flex;align-items:center;text-align:left;gap:12px;padding:16px 12px;border:1px solid var(--line);border-radius:16px;background:#fff;min-height:88px;box-shadow:var(--shadow);color:var(--ink)}.quick .ico{display:grid;place-items:center;width:45px;height:45px;border-radius:13px;background:var(--green-pale);font-size:24px;flex:none}.quick strong{display:block;font-size:16px}.quick span{color:var(--muted);font-size:12px;display:block;margin-top:2px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}.panel h3{font-size:18px;margin:0 0 12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-weight:750;font-size:14px}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #cbd7ce;border-radius:12px;background:#fff;padding:13px 12px;color:var(--ink);min-height:49px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #21855620}.field small{font-size:12px;color:var(--muted)}.form-hint{background:#f1f7f2;border-radius:11px;padding:10px 12px;color:#355c43;font-size:13px;margin:12px 0}
    .btn{border:0;background:var(--green);color:#fff;border-radius:13px;padding:14px 16px;min-height:50px;font-weight:850;box-shadow:0 2px 0 #0e5031}.btn:active{transform:translateY(1px)}.btn.secondary{background:#e9f4ec;color:var(--green);box-shadow:none;border:1px solid #c6e3d0}.btn.warn{background:#ad5800;box-shadow:none}.btn.danger{background:#b42318;box-shadow:none}.btn.gray{background:#edf1ed;color:#23392c;box-shadow:none}.btn.small{padding:8px 10px;min-height:38px;border-radius:10px;font-size:13px;box-shadow:none}.btn.block{display:block;width:100%;margin-top:13px}.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row .btn{flex:1}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}.data-table{width:100%;border-collapse:collapse;min-width:450px}.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid #edf0ed;text-align:left;font-size:14px;vertical-align:top}.data-table th{background:#f1f6f2;color:#345242;font-weight:800;white-space:nowrap}.data-table tr:last-child td{border-bottom:0}.right{text-align:right!important}.muted{color:var(--muted)}.amount{font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#e9f4ec;color:var(--green);font-weight:750;white-space:nowrap}.tag.orange{background:#fff0d9;color:#8b5200}.tag.red{background:#ffebe8;color:#a5261c}.empty{padding:19px;text-align:center;color:var(--muted);font-size:14px}.basket-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0ed}.basket-item:last-child{border-bottom:0}.basket-item strong{display:block}.basket-item small{display:block;color:var(--muted)}.basket-total{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f0f8f2;border-radius:12px;margin-top:12px;font-size:16px}.basket-total strong{font-size:22px;color:var(--green)}.divider{height:1px;background:var(--line);margin:14px 0}.notice{padding:12px 13px;border-radius:12px;font-size:13px;background:#eaf3ff;color:#204c86;margin-bottom:12px}.notice.warn{background:#fff4df;color:#7a4a00}.subnav{display:flex;gap:7px;overflow-x:auto;margin:0 0 13px;padding-bottom:3px}.subnav button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;white-space:nowrap;font-weight:750;color:#365142}.subnav button.active{background:var(--green);color:#fff;border-color:var(--green)}
    .bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 18px #183d2810}.nav-btn{border:0;background:transparent;color:#69776e;border-radius:12px;min-height:54px;padding:5px 2px;font-size:11px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav-btn .nav-ico{font-size:21px;line-height:1.1}.nav-btn.active{color:var(--green);background:var(--green-pale)}.toast{position:fixed;z-index:30;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d3427;color:#fff;padding:12px 17px;border-radius:13px;max-width:calc(100% - 32px);box-shadow:0 5px 24px #0002;display:none;font-size:14px;font-weight:700}.toast.show{display:block;animation:pop .18s ease-out}@keyframes pop{from{opacity:.2;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
    .small-note{font-size:12px;color:var(--muted);line-height:1.6}.loading{padding:25px}.price-table input{width:110px;max-width:100%;padding:9px;border:1px solid #cbd7ce;border-radius:9px}.money-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0ed}.money-row:last-child{border-bottom:0}.money-row span{color:var(--muted)}.money-row strong{font-variant-numeric:tabular-nums;text-align:right}.footer-note{text-align:center;color:#87928b;font-size:11px;padding:17px 8px 5px}
    .chart-bars{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:8px 2px 12px;min-height:205px;scrollbar-width:thin}
    .chart-bar-item{flex:0 0 39px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
    .chart-bar-value{font-size:10px;color:var(--muted);height:18px;white-space:nowrap;writing-mode:horizontal-tb}
    .chart-bar-track{height:142px;width:26px;display:flex;align-items:flex-end;justify-content:center;background:#f0f5f1;border-radius:8px 8px 4px 4px;overflow:hidden}
    .chart-bar-fill{width:100%;min-height:0;background:linear-gradient(180deg,#42a66a,#176b45);border-radius:7px 7px 2px 2px}
    .chart-bar-label{font-size:11px;color:var(--muted);white-space:nowrap}
    .chart-wrap{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
    .pie-layout{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr);gap:16px;align-items:center}
    .pie-chart{width:100%;max-width:190px;aspect-ratio:1;border-radius:50%;position:relative;margin:auto;box-shadow:inset 0 0 0 1px #00000008}
    .pie-chart:after{content:'';position:absolute;inset:27%;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #edf1ed}
    .pie-legend{display:flex;flex-direction:column;gap:9px;min-width:0}
    .pie-legend-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px}
    .pie-dot{width:11px;height:11px;border-radius:4px}
    .chart-empty{border:1px dashed #cbd7ce;border-radius:12px;padding:23px;text-align:center;color:var(--muted);font-size:14px}
    .history-actions{display:flex;gap:6px;flex-wrap:wrap}
    .edit-mode-banner{padding:12px;border-radius:12px;background:#fff2d9;color:#774900;font-weight:750;margin:0 0 13px}
    .save-status{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:#eef7f0;padding:11px;border-radius:12px;font-size:13px;color:#315b40}
    @media(max-width:430px){.pie-layout{grid-template-columns:1fr}.pie-chart{max-width:180px}.pie-legend{width:100%}}
    @media(min-width:650px){main{padding:22px 20px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.inventory-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.summary .num{font-size:23px}.topbar{padding-left:24px;padding-right:24px}.form-grid.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:370px){.brand h1{font-size:17px}.install-btn{font-size:12px;padding:9px}.summary{padding:12px}.summary .num{font-size:19px}.field input,.field select{padding:11px 9px}.quick{padding:12px 9px;gap:8px}.quick .ico{width:38px;height:38px}.quick strong{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="toprow"><div class="brand"><div class="brand-icon">🥚</div><div><h1 id="headerShopName">ကြက်ဥဆိုင် စာရင်း</h1><p>အဝင် · အရောင်း · လက်ကျန် · ငွေစာရင်း</p></div></div><button id="installBtn" class="install-btn" hidden>＋ တပ်ဆင်ရန်</button></div></header>
  <main id="app" aria-live="polite"><div class="loading">စာရင်းဖွင့်နေပါသည်…</div></main>
  <nav class="bottom-nav" aria-label="အဓိကစာမျက်နှာများ">
    <button class="nav-btn active" data-page="home"><span class="nav-ico">🏠</span><span>ပင်မ</span></button>
    <button class="nav-btn" data-page="sales"><span class="nav-ico">🛒</span><span>အရောင်း</span></button>
    <button class="nav-btn" data-page="purchase"><span class="nav-ico">🚚</span><span>အဝင်</span></button>
    <button class="nav-btn" data-page="stock"><span class="nav-ico">📦</span><span>လက်ကျန်</span></button>
    <button class="nav-btn" data-page="more"><span class="nav-ico">☰</span><span>အခြား</span></button>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <input id="restoreFile" type="file" accept="application/json,.json" hidden>
<script>
(() => {
  'use strict';
  const KEY = 'egg_shop_manager_v1';
  const PRODUCTS = [
    {id:'small',name:'ဥသေး',emoji:'🥚'},
    {id:'medium',name:'ဥလတ်',emoji:'🥚'},
    {id:'regular',name:'ပုံမှန်ဥ',emoji:'🥚'},
    {id:'large',name:'ဥကြီး',emoji:'🥚'},
    {id:'broken',name:'ကွဲဥ',emoji:'🍳'}
  ];
  const UNITS = [
    {id:'tray',name:'ဆွဲ',pieces:300},
    {id:'carton',name:'ကဒ်',pieces:30},
    {id:'piece',name:'အလုံး',pieces:1}
  ];
  const $ = (s,root=document) => root.querySelector(s);
  const $$ = (s,root=document) => [...root.querySelectorAll(s)];
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const money = v => Math.round(num(v)).toLocaleString('en-US') + ' ကျပ်';
  const qtyFmt = v => Math.max(0,Math.floor(num(v))).toLocaleString('en-US');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const product = id => PRODUCTS.find(p=>p.id===id) || PRODUCTS[0];
  const unit = id => UNITS.find(u=>u.id===id) || UNITS[2];
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const now = () => new Date().toISOString();
  const newStock = () => Object.fromEntries(PRODUCTS.map(p=>[p.id,{qty:0,costValue:0}]));
  function defaults(){
    const prices={}; PRODUCTS.forEach(p=>prices[p.id]={tray:0,carton:0,piece:0});
    return {version:1,settings:{shopName:'ကြက်ဥဆိုင် စာရင်း',prices},stock:newStock(),sales:[],purchases:[],transfers:[],expenses:[],customerPayments:[],supplierPayments:[]};
  }
  function load(){
    try { const raw=localStorage.getItem(KEY); if(!raw) return defaults(); const d=JSON.parse(raw); const base=defaults();
      if(!d || typeof d!=='object') return base;
      return {...base,...d,settings:{...base.settings,...(d.settings||{}),prices:{...base.settings.prices,...(d.settings?.prices||{})}},stock:{...base.stock,...(d.stock||{})},sales:Array.isArray(d.sales)?d.sales:[],purchases:Array.isArray(d.purchases)?d.purchases:[],transfers:Array.isArray(d.transfers)?d.transfers:[],expenses:Array.isArray(d.expenses)?d.expenses:[],customerPayments:Array.isArray(d.customerPayments)?d.customerPayments:[],supplierPayments:Array.isArray(d.supplierPayments)?d.supplierPayments:[]};
    } catch(e){ console.error(e); return defaults(); }
  }
  let state=load(); let page='home'; let moreTab='accounts'; let reportDay=today(); let analysisDate=today(); let analysisPeriod='week'; let cart=[]; let saleMode='cash'; let salePaid=''; let saleTendered=''; let saleCustomer=''; let editingSaleId=null; let installPrompt=null;
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));try{localStorage.setItem(KEY+'_lastSavedAt',now());}catch(markerError){console.warn('Save timestamp could not be stored',markerError);}return true;}catch(e){console.error(e);setTimeout(()=>toast('⚠️ ဖုန်းထဲတွင် ဒေတာမသိမ်းနိုင်ပါ။ စာရင်းမပိတ်ခင် Backup ဖိုင်သိမ်းပြီး ဖုန်းနေရာလွတ်ကို စစ်ပါ။'),80);return false;} }
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800);}
  function lastSavedLabel(){try{const value=localStorage.getItem(KEY+'_lastSavedAt');return value?dateTime(value):'သိမ်းဆည်းချိန် မရသေးပါ';}catch(e){return 'Browser သိမ်းဆည်းခွင့် မရှိပါ';}}
  function stockRow(id){ if(!state.stock[id]) state.stock[id]={qty:0,costValue:0}; if(!Number.isFinite(state.stock[id].qty))state.stock[id].qty=0; if(!Number.isFinite(state.stock[id].costValue))state.stock[id].costValue=0; return state.stock[id]; }
  const avgCost = id => {const s=stockRow(id);return s.qty>0?s.costValue/s.qty:0;};
  function unitLabel(id){return unit(id).name;}
  function piecesText(pieces){ let n=Math.max(0,Math.floor(num(pieces))); const t=Math.floor(n/300);n%=300;const c=Math.floor(n/30);n%=30;const out=[];if(t)out.push(`${qtyFmt(t)} ဆွဲ`);if(c)out.push(`${qtyFmt(c)} ကဒ်`);if(n||!out.length)out.push(`${qtyFmt(n)} လုံး`);return out.join(' '); }
  function dateTime(iso){try{return new Date(iso).toLocaleString('my-MM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return new Date(iso).toLocaleString();}}
  function dateOnly(iso){try{return new Date(iso).toLocaleDateString('my-MM',{year:'numeric',month:'short',day:'numeric'});}catch(e){return String(iso).slice(0,10);}}
  function localDateKey(iso){try{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}catch(e){return String(iso||'').slice(0,10);}}
  function isToday(iso){return localDateKey(iso)===today();}
  function allEvents(){
    const a=[];
    state.sales.forEach(x=>a.push({id:x.id,type:'sale',date:x.date,title:'အရောင်း',person:x.customer||'လက်လီဖောက်သည်',amount:x.total,details:(x.items||[]).map(i=>`${product(i.product).name} ${piecesText(i.qtyPieces)}`).join('၊ ')}));
    state.purchases.forEach(x=>a.push({id:x.id,type:'purchase',date:x.date,title:'ကြက်ဥအဝင်',person:x.supplier||'အမည်မသိကြက်ခြံ',amount:x.cost,details:`${product(x.product).name} ${piecesText(x.qtyPieces)}`}));
    state.transfers.forEach(x=>a.push({id:x.id,type:'transfer',date:x.date,title:'ကွဲဥပြောင်း',person:'လက်ကျန်ပြောင်းရွှေ့',amount:0,details:`${product(x.from).name} → ကွဲဥ · ${piecesText(x.qtyPieces)}`}));
    state.expenses.forEach(x=>a.push({id:x.id,type:'expense',date:x.date,title:'အသုံးစရိတ်',person:x.note||x.category,amount:x.amount,details:x.category||'အခြား'}));
    state.customerPayments.forEach(x=>a.push({id:x.id,type:'customerPayment',date:x.date,title:'ဖောက်သည်ငွေလက်ခံ',person:x.customer,amount:x.amount,details:'အကြွေးပြန်ဆပ်ငွေ'}));
    state.supplierPayments.forEach(x=>a.push({id:x.id,type:'supplierPayment',date:x.date,title:'ကြက်ခြံငွေပေး',person:x.supplier,amount:x.amount,details:'ပေးရန်ရှိငွေ ရှင်းတမ်း'}));
    return a.sort((a,b)=>new Date(b.date)-new Date(a.date));
  }
  function customerBalances(){
    const map={}; const add=(name,v)=>{name=String(name||'').trim();if(!name)return;map[name]=(map[name]||0)+v;};
    state.sales.forEach(s=>{if(s.customer)add(s.customer,Math.max(0,num(s.total)-num(s.paid)));});
    state.customerPayments.forEach(p=>add(p.customer,-num(p.amount)));
    return Object.entries(map).map(([name,balance])=>({name,balance:Math.max(0,balance)})).filter(x=>x.balance>0.001).sort((a,b)=>b.balance-a.balance);
  }
  function supplierBalances(){
    const map={}; const add=(name,v)=>{name=String(name||'').trim();if(!name)return;map[name]=(map[name]||0)+v;};
    state.purchases.forEach(p=>{if(p.supplier)add(p.supplier,Math.max(0,num(p.cost)-num(p.paid)));});
    state.supplierPayments.forEach(p=>add(p.supplier,-num(p.amount)));
    return Object.entries(map).map(([name,balance])=>({name,balance:Math.max(0,balance)})).filter(x=>x.balance>0.001).sort((a,b)=>b.balance-a.balance);
  }
  function selectProducts(selected,includeBroken=true){return PRODUCTS.filter(p=>includeBroken||p.id!=='broken').map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name}</option>`).join('');}

  function renderAnalysis(){

      const y=anchor.getFullYear();for(let m=0;m<12;m++){const key=`${y}-${String(m+1).padStart(2,'0')}`;buckets.push({key,label:`${m+1} လ`,title:`${y}-${String(m+1).padStart(2,'0')}`});}

      const y=anchor.getFullYear(),m=anchor.getMonth(),days=new Date(y,m+1,0).getDate();for(let d=1;d<=days;d++){const date=new Date(y,m,d,12);const key=dateKeyAt(date);buckets.push({key,label:String(d),title:key});}
    }else{
      for(let i=6;i>=0;i--){const d=new Date(anchor);d.setDate(d.getDate()-i);const key=dateKeyAt(d);buckets.push({key,label:`${d.getMonth()+1}/${d.getDate()}`,title:key});}

  function refreshSaleHint(){const p=$('#sProduct')?.value,u=$('#sUnit')?.value,q=num($('#sQty')?.value);if(!p||!u)return;const s=stockRow(p);const px=unit(u).pieces;const hint=$('#sStockHint');if(hint)hint.textContent=`လက်ကျန် ${qtyFmt(s.qty)} လုံး (${piecesText(s.qty)}) · ရွေးထားသည် ${qtyFmt(q*px)} လုံး`;const price=$('#sPrice');if(price && !price.dataset.touched){const v=state.settings.prices?.[p]?.[u];if(v!==undefined)price.value=num(v)||'';}}
  function refreshCheckoutHint(){const el=$('#checkoutCashHint');if(!el)return;const total=cart.reduce((n,x)=>n+x.amount,0),tendered=$('#sTendered')?num($('#sTendered').value):num(saleTendered);if(saleMode==='cash'){el.textContent=`ကျသင့်ငွေ ${money(total)} · ပေးငွေ ${money(tendered)} · ${tendered>=total?'ပြန်အမ်းငွေ '+money(tendered-total):'လိုအပ်ငွေ '+money(total-tendered)}`;}else{const paid=$('#sPaid')?num($('#sPaid').value):num(salePaid);el.textContent=`ကျသင့်ငွေ ${money(total)} · ယခုလက်ခံငွေ ${money(paid)} · အကြွေးကျန် ${money(Math.max(0,total-paid))}`;}}
  function refreshPurchaseHint(){const p=$('#pProduct')?.value,u=$('#pUnit')?.value,q=num($('#pQty')?.value);const hint=$('#pQtyHint');if(hint&&p&&u)hint.textContent=`ဝင်မည့်ပမာဏ ${qtyFmt(q*unit(u).pieces)} လုံး (${piecesText(q*unit(u).pieces)}) ဖြစ်ပါမယ်။`;}
  function refreshTransferHint(){const from=$('#tFrom')?.value,u=$('#tUnit')?.value,q=num($('#tQty')?.value);const hint=$('#tStockHint');if(hint&&from&&u){const s=stockRow(from);hint.textContent=`${product(from).name} လက်ကျန် ${qtyFmt(s.qty)} လုံး · ပြောင်းမည့်ပမာဏ ${qtyFmt(q*unit(u).pieces)} လုံး`};}
  function id(){return `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-page]');if(nav && nav.classList.contains('nav-btn')){setPage(nav.dataset.page);return;}
    const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;

    if(act==='editSale'){const sale=state.sales.find(s=>s.id===b.dataset.id);if(!sale){toast('ဒီအရောင်းမှတ်တမ်းကို မတွေ့ပါ။');return;}editingSaleId=sale.id;cart=(sale.items||[]).map(x=>({...x}));saleCustomer=sale.customer||'';salePaid=String(num(sale.paid));saleTendered=String(num(sale.total));saleMode=num(sale.paid)>=num(sale.total)?'cash':(num(sale.paid)>0?'partial':'credit');setPage('sales');toast('အရောင်းမှတ်တမ်းကို ပြင်ဆင်နိုင်ပါပြီ။');return;}
    if(act==='editPurchaseInfo'){const x=state.purchases.find(p=>p.id===b.dataset.id);if(!x){toast('အဝင်မှတ်တမ်း မတွေ့ပါ။');return;}const supplier=prompt('ကြက်ခြံ / ပေးသွင်းသူအမည်',x.supplier||'');if(supplier===null)return;const paidText=prompt(`ယခု ပေးချေငွေ (စုစုပေါင်း ${money(x.cost)})`,String(x.paid??0));if(paidText===null)return;const paid=Math.round(num(paidText));if(!supplier.trim()||paid<0||paid>num(x.cost)){toast('ကြက်ခြံအမည်နှင့် ပေးချေငွေကို ပြန်စစ်ပါ။');return;}const note=prompt('မှတ်ချက်',x.note||'');if(note===null)return;x.supplier=supplier.trim();x.paid=paid;x.note=note.trim();save();render();toast('ကြက်ဥအဝင်စာရင်း ပြင်ပြီးပါပြီ။');return;}
    if(act==='editExpense'){const x=state.expenses.find(p=>p.id===b.dataset.id);if(!x){toast('အသုံးစရိတ်မှတ်တမ်း မတွေ့ပါ။');return;}const amountText=prompt('အသုံးစရိတ်ပမာဏ (ကျပ်)',String(x.amount));if(amountText===null)return;const amount=Math.round(num(amountText));if(amount<1){toast('ငွေပမာဏကို မှန်ကန်စွာထည့်ပါ။');return;}const note=prompt('မှတ်ချက်',x.note||'');if(note===null)return;x.amount=amount;x.note=note.trim();save();render();toast('အသုံးစရိတ်စာရင်း ပြင်ပြီးပါပြီ။');return;}
    if(act==='fillCustomerPay'){moreTab='accounts';render();setTimeout(()=>{const n=$('#cpName'),a=$('#cpAmount');if(n)n.value=b.dataset.name;if(a)a.value=Math.round(num(b.dataset.balance));},0);return;}
    if(act==='fillSupplierPay'){moreTab='accounts';render();setTimeout(()=>{const n=$('#spName'),a=$('#spAmount');if(n)n.value=b.dataset.name;if(a)a.value=Math.round(num(b.dataset.balance));},0);return;}
    if(act==='backup'){backup();return;}
    if(act==='restore'){$('#restoreFile').click();return;}
    if(act==='exportCsv'){exportCSV();return;}
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='sProduct'||t.id==='sUnit'){const p=$('#sPrice');if(p)p.dataset.touched='';refreshSaleHint();}

  document.addEventListener('input',e=>{if(e.target.id==='sPrice')e.target.dataset.touched='1';if(e.target.id==='sPaid')salePaid=e.target.value;if(e.target.id==='sTendered')saleTendered=e.target.value;if(e.target.id==='sCustomer')saleCustomer=e.target.value;if(e.target.id==='sPaid'||e.target.id==='sTendered')refreshCheckoutHint();});
  document.addEventListener('submit',e=>{
    const form=e.target; e.preventDefault(); const fd=new FormData(form); const v=k=>fd.get(k);
    if(form.id==='addItemForm'){
      const pid=String(v('product')),uid=String(v('unit')),q=Math.floor(num(v('qty'))),price=num(v('price')),pieces=q*unit(uid).pieces;
      if(q<1||!Number.isInteger(q)){toast('အရေအတွက်ကို မှန်ကန်စွာ ထည့်ပါ။');return;}
      if(price<0){toast('ရောင်းဈေး မှန်ကန်စွာ ထည့်ပါ။');return;}
      const already=cart.filter(x=>x.product===pid).reduce((n,x)=>n+x.qtyPieces,0);
      const originalForProduct=editingSaleId?(state.sales.find(s=>s.id===editingSaleId)?.items||[]).filter(x=>x.product===pid).reduce((n,x)=>n+num(x.qtyPieces),0):0;
      if(already+pieces>stockRow(pid).qty+originalForProduct){toast(`${product(pid).name} လက်ကျန် မလုံလောက်ပါ။ ပြင်ဆင်မှုပါထည့်တွက်ပြီး ရနိုင်သည့်ပမာဏ ${qtyFmt(stockRow(pid).qty+originalForProduct)} လုံးရှိပါတယ်။`);return;}
      cart.push({product:pid,unit:uid,qty:q,qtyPieces:pieces,unitPrice:price,amount:q*price});
      if(saleMode==='cash'){salePaid=String(cart.reduce((n,x)=>n+x.amount,0));saleTendered=salePaid;}render();toast('အရောင်းစာရင်းထဲ ထည့်ပြီးပါပြီ။');return;
    }
    if(form.id==='saveSaleForm'){
      if(!cart.length){toast('အရောင်းစာရင်းထဲမှာ ကြက်ဥထည့်ပါ။');return;}
      const customer=String(v('customer')||'').trim(),mode=String(v('mode')),total=cart.reduce((n,x)=>n+x.amount,0),paid=Math.round(num(v('paid')));
      if(mode!=='cash'&&!customer){toast('အကြွေးစာရင်းအတွက် ဖောက်သည်အမည် ထည့်ပါ။');return;}
      if(paid<0||paid>total){toast('လက်ခံငွေသည် စုစုပေါင်းရောင်းငွေထက် မများရပါ။');return;}
      if(mode==='cash'&&paid!==total){toast('လက်ငင်းအပြည့်ရောင်းပါက စုစုပေါင်းငွေကို ထည့်ပါ။');return;}
      const tendered=Math.round(num(v('tendered')));if(mode==='cash'&&tendered<total){toast(`ပေးလာသောငွေ ${money(tendered)} သည် ကျသင့်ငွေ ${money(total)} ထက်နည်းနေပါတယ်။`);return;}
      const oldSale=editingSaleId?state.sales.find(s=>s.id===editingSaleId):null;
      const originalQty={};if(oldSale)(oldSale.items||[]).forEach(x=>originalQty[x.product]=(originalQty[x.product]||0)+num(x.qtyPieces));
      const requested={};cart.forEach(x=>requested[x.product]=(requested[x.product]||0)+num(x.qtyPieces));

      // When editing, reverse the original sale first, then apply the corrected basket.

      let cost=0;const items=cart.map(x=>{const st=stockRow(x.product);const uc=st.qty>0?st.costValue/st.qty:0;const c=Math.min(st.costValue,uc*x.qtyPieces);st.qty-=x.qtyPieces;st.costValue=Math.max(0,st.costValue-c);cost+=c;return {...x,cost:c,profit:x.amount-c};});
      const sale={id:oldSale?oldSale.id:id(),date:oldSale?oldSale.date:now(),customer,total,paid,items,cost,profit:total-cost,...(oldSale?{editedAt:now()}: {})};
      if(oldSale)state.sales=state.sales.filter(s=>s.id!==oldSale.id);state.sales.push(sale);save();cart=[];saleMode='cash';salePaid='';saleTendered='';saleCustomer='';editingSaleId=null;render();toast(`${oldSale?'အရောင်းပြင်ဆင်ချက်':'အရောင်း'} သိမ်းပြီးပါပြီ · ${money(total)}`);return;

    if(form.id==='purchaseForm'){
      const supplier=String(v('supplier')||'').trim(),pid=String(v('product')),uid=String(v('unit')),q=Math.floor(num(v('qty'))),pieces=q*unit(uid).pieces,cost=Math.round(num(v('cost'))),paid=Math.round(num(v('paid'))),note=String(v('note')||'').trim();
      if(!supplier){toast('ကြက်ခြံအမည် ထည့်ပါ။');return;}if(q<1){toast('အရေအတွက်ကို မှန်ကန်စွာ ထည့်ပါ။');return;}if(cost<0||paid<0||paid>cost){toast('ဝယ်ဈေးနှင့် ပေးချေငွေကို စစ်ဆေးပါ။');return;}
      const s=stockRow(pid);s.qty+=pieces;s.costValue+=cost;state.purchases.push({id:id(),date:now(),supplier,product:pid,unit:uid,qty:q,qtyPieces:pieces,cost,paid,note});save();form.reset();render();toast('ကြက်ဥအဝင်သိမ်းပြီးပါပြီ။');return;
    }
    if(form.id==='transferForm'){
      const from=String(v('from')),uid=String(v('unit')),q=Math.floor(num(v('qty'))),pieces=q*unit(uid).pieces,note=String(v('note')||'').trim();
      if(q<1){toast('အရေအတွက်ကို မှန်ကန်စွာ ထည့်ပါ။');return;}const src=stockRow(from);if(src.qty<pieces){toast('မူလဥလက်ကျန် မလုံလောက်ပါ။');return;}
      const movingCost=src.qty>0?Math.min(src.costValue,src.costValue/src.qty*pieces):0;src.qty-=pieces;src.costValue=Math.max(0,src.costValue-movingCost);const dst=stockRow('broken');dst.qty+=pieces;dst.costValue+=movingCost;state.transfers.push({id:id(),date:now(),from,qty:q,unit:uid,qtyPieces:pieces,cost:movingCost,note});save();render();toast('ကွဲဥစာရင်းသို့ ပြောင်းပြီးပါပြီ။');return;
    }
    if(form.id==='customerPayForm'){
      const customer=String(v('name')||'').trim(),amount=Math.round(num(v('amount')));if(!customer||amount<1){toast('ဖောက်သည်အမည်နှင့် ငွေပမာဏ ထည့်ပါ။');return;}const balance=customerBalances().find(x=>x.name===customer)?.balance||0;if(amount>balance+0.001){toast(`ဒီဖောက်သည်၏ အကြွေးကျန်မှာ ${money(balance)} ဖြစ်ပါတယ်။`);return;}state.customerPayments.push({id:id(),date:now(),customer,amount});save();render();toast('ဖောက်သည်ငွေလက်ခံစာရင်း သိမ်းပြီးပါပြီ။');return;
    }
    if(form.id==='supplierPayForm'){
      const supplier=String(v('name')||'').trim(),amount=Math.round(num(v('amount')));if(!supplier||amount<1){toast('ကြက်ခြံအမည်နှင့် ငွေပမာဏ ထည့်ပါ။');return;}const balance=supplierBalances().find(x=>x.name===supplier)?.balance||0;if(amount>balance+0.001){toast(`ဒီကြက်ခြံပေးရန်ကျန်ငွေမှာ ${money(balance)} ဖြစ်ပါတယ်။`);return;}state.supplierPayments.push({id:id(),date:now(),supplier,amount});save();render();toast('ကြက်ခြံငွေပေးချေစာရင်း သိမ်းပြီးပါပြီ။');return;
    }
    if(form.id==='expenseForm'){
      const category=String(v('category')),amount=Math.round(num(v('amount'))),note=String(v('note')||'').trim();if(amount<1){toast('အသုံးစရိတ် ငွေပမာဏထည့်ပါ။');return;}state.expenses.push({id:id(),date:now(),category,amount,note});save();render();toast('အသုံးစရိတ်သိမ်းပြီးပါပြီ။');return;
    }
    if(form.id==='settingsForm'){
      state.settings.shopName=String(v('shopName')||'ကြက်ဥဆိုင် စာရင်း').trim()||'ကြက်ဥဆိုင် စာရင်း';state.settings.prices={};PRODUCTS.forEach(p=>{state.settings.prices[p.id]={};UNITS.forEach(u=>state.settings.prices[p.id][u.id]=Math.max(0,Math.round(num(v(`price_${p.id}_${u.id}`)))));});save();render();toast('ဆိုင်အမည်နှင့် ဈေးနှုန်း သိမ်းပြီးပါပြီ။');return;
    }
  });
  function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,`egg-shop-backup-${today()}.json`);toast('Backup ဖိုင် စတင်သိမ်းနေပါပြီ။');}
  function exportCSV(){const rows=[['ရက်စွဲ','ဖောက်သည်','ကြက်ဥအမျိုးအစား','အရေအတွက် (လုံး)','အရောင်းငွေ','လက်ခံငွေ','အကြွေး','ကုန်ကျစရိတ်','အမြတ်']];state.sales.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(s=>s.items.forEach(i=>rows.push([new Date(s.date).toISOString(),s.customer||'လက်လီ',product(i.product).name,i.qtyPieces,i.amount,s.paid,s.total-s.paid,i.cost,i.profit])));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`egg-shop-sales-${today()}.csv`);toast('CSV ဖိုင် ထုတ်ပေးနေပါပြီ။');}
  $('#restoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!d.stock||!Array.isArray(d.sales)||!Array.isArray(d.purchases))throw new Error('ဖိုင်ပုံစံ မမှန်ပါ');if(!confirm('Backup ဖိုင်ထဲက ဒေတာဖြင့် လက်ရှိစာရင်းအားလုံးကို အစားထိုးမလား။ လက်ရှိဒေတာလိုပါက အရင် Backup သိမ်းပါ။'))return;state={...defaults(),...d,settings:{...defaults().settings,...(d.settings||{}),prices:{...defaults().settings.prices,...(d.settings?.prices||{})}},stock:{...newStock(),...(d.stock||{})},sales:d.sales||[],purchases:d.purchases||[],transfers:d.transfers||[],expenses:d.expenses||[],customerPayments:d.customerPayments||[],supplierPayments:d.supplierPayments||[]};save();cart=[];moreTab='accounts';setPage('home');toast('Backup ပြန်ထည့်ပြီးပါပြီ။');}catch(err){console.error(err);toast('Backup ဖိုင်မမှန်ပါ။ JSON Backup ဖိုင်ကို ရွေးပါ။');}finally{e.target.value='';}});
  const installBtn=$('#installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false;});installBtn.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true;}else{toast('Chrome မီနူး (⋮) ထဲမှ “Install app” သို့မဟုတ် “Add to Home screen” ကို ရွေးပါ။');}});
  window.addEventListener('appinstalled',()=>{installBtn.hidden=true;toast('App ကို ဖုန်းထဲတပ်ဆင်ပြီးပါပြီ။');});
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>false);}
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline cache registration failed',err)));}
  render();
})();
</script>
